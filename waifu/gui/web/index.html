<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ubunchan</title>
<style>
  :root {
    --bg-top: #ffffff; --bg-bottom: #ffffff; --glow: transparent;
    --bubble-bg: rgba(255, 255, 255, 0.94); --bubble-fg: #1d1b2e; --muted: #8e90a8;
  }
  :root[data-theme="light"] {
    --bg-top: #ffffff; --bg-bottom: #ffffff; --glow: transparent;
    --bubble-bg: #ffffff; --bubble-fg: #1d1b2e; --muted: #6b6d85;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; user-select: none;
    font-family: "Inter", "Noto Sans", "Ubuntu", system-ui, sans-serif; }
  body { background:
      radial-gradient(ellipse 60% 55% at 50% 42%, var(--glow), transparent 70%),
      linear-gradient(180deg, var(--bg-top), var(--bg-bottom)); }
  canvas { display: block; }
  #bubble {
    position: absolute; left: 50%; bottom: 18px; transform: translate(-50%, 10px);
    max-width: min(640px, 86vw); padding: 12px 18px; border-radius: 16px;
    background: var(--bubble-bg); color: var(--bubble-fg); font-size: 15px; line-height: 1.45;
    box-shadow: 0 8px 28px rgba(0,0,0,0.28); opacity: 0; transition: opacity .25s, transform .25s;
    pointer-events: none; text-align: center;
  }
  #bubble.show { opacity: 1; transform: translate(-50%, 0); }
  #status { position: absolute; left: 0; right: 0; top: 45%; text-align: center;
    color: var(--muted); font-size: 14px; }
  #status .bar { width: 180px; height: 3px; margin: 10px auto 0; background: rgba(128,128,160,.25);
    border-radius: 2px; overflow: hidden; }
  #status .bar div { height: 100%; width: 0; background: #8b7cff; transition: width .15s; }
</style>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/",
    "@pixiv/three-vrm": "./vendor/three-vrm.module.min.js"
} }
</script>
</head>
<body>
<div id="status">Loading model…<div class="bar"><div id="progress"></div></div></div>
<div id="bubble"></div>
<script type="module" src="./avatar.js"></script>
</body>
</html>
