# Copy to config.toml (next to this file) or ~/.config/waifu/config.toml.
assistant_name = "Ubunchan"
backend = "claude"            # "claude" or "ollama"

# "off"      = ask before every command
# "readonly" = run read-only commands (ls, df, apt list ...) without asking
# "normal"   = also run ordinary commands (apt install ...) without asking
# Dangerous commands ALWAYS ask. Blocked commands (rm -rf /* ...) NEVER run.
autopilot = "off"

command_timeout = 900         # seconds
max_chained_commands = 3      # follow-up commands per request
vrm_path = "~/Downloads/Ubunchan1.vrm"

[claude]
model = "claude-opus-5"
effort = "low"                # low | medium | high | xhigh | max

[ollama]
host = "http://localhost:11434"
model = "llama3.2:3b"
keep_alive = "30m"            # keep the model loaded between chats

[voice]
tts_enabled = true
tts_model = "models/piper/en_US-hfc_female-medium.onnx"
tts_length_scale = 1.0        # < 1 = faster speech
pitch = 1.06                  # > 1 = higher, cuter voice
stt_enabled = true
stt_model = "base.en"         # tiny.en (fastest) / base.en / small.en (most accurate)
mic_device = "auto"           # "auto" = the input chosen in Ubuntu sound settings, or a name from: pactl list short sources
auto_stop = true              # stop listening when you stop talking
auto_send = true              # send what you said right away

[ui]
theme = "light"               # "light" (white) or "dark"
width = 560
height = 820
show_terminal = false         # show the command output panel on startup
